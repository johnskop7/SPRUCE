data:
  data_dir: /home/ubuntu/chexpert_cardiomegaly_normal_big
  batch_size: 32
  image_size: 256
  dataset_type: cardiomegaly

optim:
  lr: 5e-4
  weight_decay: 1e-2
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 5
  step_size: 30
  gamma: 0.1

adv:
  method: plain
  beta: 6
  epsilon: 0.016
  alpha: 0.0016
  pgd_steps: 10
  norm: l_inf
  adv_eval_freq: 5

train:
  epochs: 100
  patience: 10
  class_weights: [1.0, 1.382]
  label_smoothing: 0.01

model_arch: efficientnet
num_classes: 2
output_dir: /home/ubuntu/classifier_training_scripts/efficientnetb0_plain_chexpert_cardiomeagly_normal_big_exp2
device: cuda
