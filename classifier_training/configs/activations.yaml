# Extract penultimate-layer activations for PIECE

data:
  data_dir: "/path/to/dataset"
  batch_size: 128
  image_size: 256
  dataset_type: cardiomegaly

model:
  arch: convnext
  num_classes: 2
  weights: "/path/to/experiment/best_model.pth"

extract:
  save_path: "/path/to/experiment/class_activations.pkl"
