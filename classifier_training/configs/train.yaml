# Dataset
data:
  data_dir: "/path/to/dataset"
  batch_size: 32
  image_size: 256
  dataset_type: cardiomegaly

# Optimizer and learning-rate schedule
optim:
  lr: 5e-4
  weight_decay: 1e-2
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 5
  step_size: 30
  gamma: 0.1

# Plain or TRADES training
adv:
  method: plain
  beta: 6
  epsilon: 0.016
  alpha: 0.0016
  pgd_steps: 10
  norm: l_inf
  adv_eval_freq: 5

# Training
train:
  epochs: 100
  patience: 10
  class_weights: [1.0, 1.382]
  label_smoothing: 0.01

# Model
model_arch: convnext
num_classes: 2

# Output / device
output_dir: "/path/to/experiment"
device: cuda
