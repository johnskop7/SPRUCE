# Select correctly classified, high-confidence query images

data:
  data_dir: "/path/to/dataset"
  batch_size: 64
  image_size: 256
  dataset_type: cardiomegaly

model:
  arch: convnext
  num_classes: 2
  weights: "/path/to/experiment/best_model.pth"

extract:
  output_dir: "/path/to/query_images"
  class_number: 1
  threshold: 0.8
  num_images: 200
