# GAN inversion / PTI artifacts
gan:
  original_weights: "/path/to/stylegan2_ada.pkl"
  checkpoints_dir: "/path/to/pti_generators"
  embeddings_dir: "/path/to/pti_embeddings"
  original_images_dir: "/path/to/query_images"
  output_dir: "/path/to/counterfactual_experiment"

# Classifier
classifier:
  type: "convnext"
  weights: "/path/to/classifier/best_model.pth"
  num_classes: 2
  normalized: true

# PIECE
piece:
  counterfactual_class: 1
  class_activations: "/path/to/classifier/class_activations.pkl"
  alpha: 0.05
  n_components: 5

# Latent optimization
opt:
  lr: 0.02
  epochs: 200
  lambda_piece: 1.0
  lambda_perc: 0.01
  lambda_latent: 1e-3
  lambda_image: 1e-6
  image_size: 256
